[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "data",
    "dbt/medicare_claims/target",
    "dbt/medicare_claims/dbt_packages",
]

[tool.ruff.lint]
# Defaults are E4/E7/E9/F; extend with import-sorting, naive-datetime, and
# import-not-at-top-of-file (several files need sys.path.insert() before an
# import, which is intentional -- see their `# noqa: E402` comments).
extend-select = ["I", "DTZ", "E402"]

[tool.ruff.lint.per-file-ignores]
# dbutils/spark are Databricks-injected notebook globals at runtime, not
# real undefined names -- this file is never run locally, only uploaded.
"spark_jobs/databricks/bronze_silver_notebook.py" = ["F821"]
# Naive datetime is idiomatic for Airflow's start_date (Airflow interprets
# it via its own default_timezone config); every DAG in this project uses
# the same pattern.
"orchestration/airflow/dags/*.py" = ["DTZ001"]

[tool.black]
line-length = 120
target-version = ["py311"]
